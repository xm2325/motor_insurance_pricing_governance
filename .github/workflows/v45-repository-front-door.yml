name: Historical repository front-door audit v0.45

# v0.45 is retained as a historical audit only. It no longer listens to README or
# evidence pushes because its frozen v0.44-era template must not overwrite the
# rolling repository front door owned by v0.50+.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-front-door-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce historical v0.45 README front door in workspace only
        run: |
          python scripts/refresh_repository_front_door_v45.py
          python scripts/refresh_repository_front_door_v45.py
      - name: Run historical v0.45 contracts
        run: python -m unittest -v tests/test_repository_front_door_v45.py
      - name: Reproduce historical v0.45 registry migration in workspace only
        run: |
          python scripts/migrate_evidence_registry_v45.py
          python scripts/migrate_evidence_registry_v45.py
      - name: Build historical v0.45 audit summary
        run: python build_repository_front_door_summary_v45.py
      - name: Verify historical documentation-only boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('results_v45/repository_front_door_summary_v45.json').read_text())
          assert result['status'] == 'V45_REPOSITORY_FRONT_DOOR_SYNC_PASS'
          assert result['scope'] == 'documentation_and_evidence_navigation_only'
          assert result['model_fit_executed'] is False
          assert result['row_level_data_accessed'] is False
          assert result['historical_model_or_validation_decisions_changed'] is False
          PY
      - name: Upload historical v0.45 documentation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-motor-pricing-repository-front-door-v45
          path: results_v45/
          if-no-files-found: warn
