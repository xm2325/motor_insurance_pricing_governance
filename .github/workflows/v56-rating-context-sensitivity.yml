name: Rating-context sensitivity audit v0.56

on:
  pull_request:
    paths:
      - 'governance/rating_context_sensitivity_protocol_v56.json'
      - 'run_rating_context_sensitivity_audit_v56.py'
      - 'tests/test_rating_context_sensitivity_v56.py'
      - '.github/workflows/v56-rating-context-sensitivity.yml'
      - 'run_rating_factor_relativity_audit_v51.py'
      - 'action_results/v51/**'
      - 'build_deployment_bundle_v21.py'
      - 'deployment/**'
      - 'download_spanish_motor_2022_2024.py'
      - 'discover_spanish_motor_2022_2024.py'
      - 'requirements.txt'
  push:
    branches: [main]
    paths:
      - 'governance/rating_context_sensitivity_protocol_v56.json'
      - 'run_rating_context_sensitivity_audit_v56.py'
      - 'tests/test_rating_context_sensitivity_v56.py'
      - '.github/workflows/v56-rating-context-sensitivity.yml'
      - 'run_rating_factor_relativity_audit_v51.py'
      - 'action_results/v51/**'
      - 'build_deployment_bundle_v21.py'
      - 'deployment/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rating-context-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore verified public-data cache
        uses: actions/cache@v4
        with:
          path: data_spanish_2022_2024
          key: spanish-motor-sw4jmdb2sm-v1-${{ runner.os }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Discover Spanish source
        run: python discover_spanish_motor_2022_2024.py
      - name: Download or reuse and verify source
        run: python download_spanish_motor_2022_2024.py
      - name: Verify v0.56 protocol is locked before scoring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('governance/rating_context_sensitivity_protocol_v56.json').read_text())
          assert p['status'] == 'V56_DEVELOPMENT_RATING_CONTEXT_SENSITIVITY_PROTOCOL_LOCKED'
          assert p['protocol_locked_before_first_v56_execution'] is True
          assert p['base_repository_commit'] == 'fe4f0d1638068879de40e1f76b5f2ebdaad2d894'
          assert list(p['target_features']) == ['driver_age', 'vehicle_age']
          contexts = p['context_selection']['contexts']
          assert [c['context_id'] for c in contexts] == [
              'BASE', 'BUSINESS_TYPE_P', 'POLICY_TYPE_COMP_E', 'FUEL_TYPE_G', 'CIRCULATION_AREA_R'
          ]
          assert p['context_selection']['context_profiles_are_synthetic_reference_profiles'] is True
          assert p['context_selection']['observed_joint_cells_claimed'] is False
          assert p['interpretation_rules']['context_stability_acceptance_threshold_created'] is False
          assert p['interpretation_rules']['predictive_validation_evidence_created'] is False
          PY
      - name: Run 2022 development-only context sensitivity audit
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python run_rating_context_sensitivity_audit_v56.py
      - name: Run v0.56 contracts
        run: python -m unittest -v tests/test_rating_context_sensitivity_v56.py
      - name: Assert synthetic-context and non-validation boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('results_v56/rating_context_sensitivity_summary_v56.json').read_text())
          assert s['analysis_role'] == 'DEVELOPMENT_ONLY_REFERENCE_PROFILE_CONTEXT_SENSITIVITY'
          assert s['source']['years_read'] == [2022]
          assert s['source']['2023_rows_read'] is False
          assert s['source']['2024_rows_read'] is False
          assert s['contexts_are_synthetic_reference_profiles'] is True
          assert s['marginal_exposure_share_is_not_joint_profile_prevalence'] is True
          assert s['context_count'] == 5
          assert s['registered_curve_point_count'] == 110
          assert s['computational_contracts']['glm_context_invariance_contract_pass'] is True
          b = s['interpretation_boundary']
          assert b['context_stability_acceptance_threshold_created'] is False
          assert b['predictive_validation_evidence_created'] is False
          assert b['causal_interaction_claimed'] is False
          assert b['observed_segment_effect_claimed'] is False
          assert b['customer_premium_effect_claimed'] is False
          assert b['candidate_selection_allowed'] is False
          assert b['model_promotion_evidence_created'] is False
          assert b['customer_pricing_authorised'] is False
          assert s['persisted_row_level_data'] is False
          PY
          test ! -e results_v56/predictions.csv
          test ! -e results_v56/raw_rows.csv
      - name: Upload v0.56 aggregate context sensitivity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-pricing-rating-context-sensitivity-v56
          path: results_v56/
          if-no-files-found: error
