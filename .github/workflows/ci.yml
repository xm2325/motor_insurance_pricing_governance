name: Lightweight model-governance CI

on:
  push:
    branches: [main]
    paths:
      - 'run_spanish_oot_2024.py'
      - 'run_rolling_origin_v14.py'
      - 'results/fremtpl2_full_frequency_benchmark.csv'
      - 'action_results/spanish_oot_2024/**'
      - 'EVIDENCE_REGISTRY.md'
      - 'tests/test_oot_contract.py'
      - 'tests/test_evidence_registry.py'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'run_spanish_oot_2024.py'
      - 'run_rolling_origin_v14.py'
      - 'results/fremtpl2_full_frequency_benchmark.csv'
      - 'action_results/spanish_oot_2024/**'
      - 'EVIDENCE_REGISTRY.md'
      - 'tests/test_oot_contract.py'
      - 'tests/test_evidence_registry.py'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check leakage, temporal design and registered evidence
        id: contract
        run: |
          python -m unittest -v \
            tests/test_oot_contract.py \
            tests/test_evidence_registry.py
      - name: Persist CI status
        if: always() && github.event_name != 'pull_request'
        env:
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path('action_results/ci')
          out.mkdir(parents=True, exist_ok=True)
          payload = {
              'workflow': 'Lightweight model-governance CI',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'sha': os.environ.get('GITHUB_SHA'),
              'contract_test_outcome': os.environ.get('CONTRACT_OUTCOME'),
          }
          (out / 'ACTION_CI_STATUS.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- action_results/ci/ACTION_CI_STATUS.json
          if git diff --cached --quiet; then
            echo "No CI status change"
          else
            git commit -m "Persist lightweight CI run ${GITHUB_RUN_ID}"
            git push origin HEAD:main
          fi
