      - 'build_bundle_lock_v27.py'
      - 'verify_environment_parity_v26.py'
      - 'verify_bundle_v27.py'
      - 'verify_release_admission_v30.py'
      - 'run_outcome_review_v31.py'
      - 'tests/fixtures/v26_locked_parity_reference.json'
      - 'tests/test_oot_contract.py'
      - 'tests/test_evidence_registry.py'
      - 'tests/test_ci_stratification_v24.py'
      - 'tests/test_download_cache_v24.py'
      - 'tests/test_runtime_contract_v25.py'
      - 'tests/test_environment_static_v26.py'
      - 'tests/test_model_io_contract_v26.py'
      - 'tests/test_runtime_and_model_io_evidence.py'
      - 'tests/test_bundle_integrity_evidence_v27.py'
      - 'tests/test_release_control_evidence_v28.py'
      - 'tests/test_artifact_attestation_evidence_v29.py'
      - 'tests/test_release_admission_evidence_v30.py'
      - 'tests/test_outcome_monitoring_v31.py'
      - 'tests/test_outcome_monitoring_static_v31.py'
      - '.github/workflows/v21-deployment.yml'
      - '.github/workflows/v22-monitoring.yml'
      - '.github/workflows/v25-runtime.yml'
      - '.github/workflows/v26-environment.yml'
      - '.github/workflows/v27-bundle-integrity.yml'
      - '.github/workflows/v29-attestation.yml'
      - '.github/workflows/v30-admission.yml'
      - '.github/workflows/v31-outcome-review.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'run_spanish_oot_2024.py'
      - 'run_rolling_origin_v14.py'
      - 'download_spanish_motor_2022_2024.py'
      - 'results/fremtpl2_full_frequency_benchmark.csv'
      - 'action_results/spanish_oot_2024/**'
      - 'action_results/v21/**'
      - 'action_results/v22/**'
      - 'action_results/v23/**'
      - 'action_results/v25/**'
      - 'action_results/v26/**'
      - 'action_results/v27/**'
      - 'action_results/v28/**'
      - 'action_results/v29/**'
      - 'action_results/v30/**'
      - 'action_results/v31/**'
      - 'EVIDENCE_REGISTRY.md'
      - 'RESULTS_V31.md'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'requirements-runtime.txt'
      - 'deployment/bundle.py'
      - 'deployment/environment.py'
      - 'deployment/provenance.py'
      - 'deployment/outcome_monitoring.py'
      - 'build_deployment_bundle_v21.py'
      - 'build_bundle_lock_v27.py'
      - 'verify_environment_parity_v26.py'
      - 'verify_bundle_v27.py'
      - 'verify_release_admission_v30.py'
      - 'run_outcome_review_v31.py'
      - 'tests/fixtures/v26_locked_parity_reference.json'
      - 'tests/test_oot_contract.py'
      - 'tests/test_evidence_registry.py'
      - 'tests/test_ci_stratification_v24.py'
      - 'tests/test_download_cache_v24.py'
      - 'tests/test_runtime_contract_v25.py'
      - 'tests/test_environment_static_v26.py'
      - 'tests/test_model_io_contract_v26.py'
      - 'tests/test_runtime_and_model_io_evidence.py'
      - 'tests/test_bundle_integrity_evidence_v27.py'
      - 'tests/test_release_control_evidence_v28.py'
      - 'tests/test_artifact_attestation_evidence_v29.py'
      - 'tests/test_release_admission_evidence_v30.py'
      - 'tests/test_outcome_monitoring_v31.py'
      - 'tests/test_outcome_monitoring_static_v31.py'
      - '.github/workflows/v21-deployment.yml'
      - '.github/workflows/v22-monitoring.yml'
      - '.github/workflows/v25-runtime.yml'
      - '.github/workflows/v26-environment.yml'
      - '.github/workflows/v27-bundle-integrity.yml'
      - '.github/workflows/v29-attestation.yml'
      - '.github/workflows/v30-admission.yml'
      - '.github/workflows/v31-outcome-review.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: light-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check leakage, evidence, cache, workflow, runtime, model-IO, bundle-integrity, release-control, attestation, admission and outcome-maturity contracts
        id: contract
        run: |
          python -m unittest -v \
            tests/test_oot_contract.py \
            tests/test_evidence_registry.py \
            tests/test_ci_stratification_v24.py \
            tests/test_download_cache_v24.py \
            tests/test_runtime_contract_v25.py \
            tests/test_environment_static_v26.py \
            tests/test_model_io_contract_v26.py \
            tests/test_runtime_and_model_io_evidence.py \
            tests/test_bundle_integrity_evidence_v27.py \
            tests/test_release_control_evidence_v28.py \
            tests/test_artifact_attestation_evidence_v29.py \
            tests/test_release_admission_evidence_v30.py \
            tests/test_outcome_monitoring_static_v31.py
      - name: Persist CI status
        if: always() && github.event_name != 'pull_request'
        env:
          CONTRACT_OUTCOME: ${{ steps.contract.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path('action_results/ci')
          out.mkdir(parents=True, exist_ok=True)
          payload = {
              'workflow': 'Lightweight model-governance CI',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'sha': os.environ.get('GITHUB_SHA'),
              'contract_test_outcome': os.environ.get('CONTRACT_OUTCOME'),
          }
          (out / 'ACTION_CI_STATUS.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- action_results/ci/ACTION_CI_STATUS.json
          if git diff --cached --quiet; then
            echo "No CI status change"
          else
            git commit -m "Persist lightweight CI run ${GITHUB_RUN_ID}"
            git push origin HEAD:main
          fi
