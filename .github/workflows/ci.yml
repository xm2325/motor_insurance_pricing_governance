name: Lightweight model-governance CI

on:
  push:
    branches: [main]
    paths:
      - 'run_spanish_oot_2024.py'
      - 'tests/test_oot_contract.py'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'run_spanish_oot_2024.py'
      - 'tests/test_oot_contract.py'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check leakage and calendar OOT contract
        run: python -m unittest -v tests/test_oot_contract.py
