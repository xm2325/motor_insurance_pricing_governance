name: Motor pricing shadow deployment v0.21

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - chatgpt/v0.21-deployment-bridge
    paths:
      - 'deployment/**'
      - 'build_deployment_bundle_v21.py'
      - 'smoke_test_deployment_v21.py'
      - 'tests/test_deployment_contract.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - '.github/workflows/v21-deployment.yml'
  pull_request:
    paths:
      - 'deployment/**'
      - 'build_deployment_bundle_v21.py'
      - 'smoke_test_deployment_v21.py'
      - 'tests/test_deployment_contract.py'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - '.github/workflows/v21-deployment.yml'

permissions:
  contents: write

jobs:
  shadow-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        id: install
        run: pip install -r requirements.txt

      - name: Run deployment and governance contracts
        id: contracts
        run: |
          python -m unittest -v \
            tests/test_deployment_contract.py \
            tests/test_oot_contract.py \
            tests/test_evidence_registry.py \
            tests/test_v20_contract.py

      - name: Discover Mendeley source
        id: discover
        run: python discover_spanish_motor_2022_2024.py

      - name: Download and verify source
        id: download
        run: python download_spanish_motor_2022_2024.py

      - name: Audit source schema
        id: audit
        run: python audit_spanish_motor_2022_2024.py

      - name: Build locked shadow model bundle
        id: bundle
        run: python build_deployment_bundle_v21.py

      - name: Run in-process API parity smoke test
        id: parity
        run: python smoke_test_deployment_v21.py

      - name: Build service container
        id: docker_build
        run: docker build -t motor-pricing-shadow:v21 .

      - name: Run container and verify network API parity
        id: container_smoke
        run: |
          docker run -d --name motor-pricing-shadow-v21 \
            -p 8000:8000 \
            -e MODEL_BUNDLE_DIR=/models \
            -v "${PWD}/deployment_artifacts:/models:ro" \
            motor-pricing-shadow:v21
          python - <<'PY'
          import json, time
          from pathlib import Path
          import httpx
          import numpy as np

          parity = json.loads(Path('deployment_artifacts/parity_reference.json').read_text())
          with httpx.Client(base_url='http://127.0.0.1:8000', timeout=5.0) as client:
              for attempt in range(30):
                  try:
                      response = client.get('/health')
                      if response.status_code == 200:
                          break
                  except Exception:
                      pass
                  time.sleep(1)
              else:
                  raise RuntimeError('Container service did not become healthy')

              health = response.json()
              assert health['governance_status'] == 'HOLD_SHADOW_ONLY'
              scored = client.post('/score', json=parity['records'][0])
              scored.raise_for_status()
              body = scored.json()
              expected = parity['scores'][0]
              for field in [
                  'reference_frequency', 'challenger_frequency',
                  'reference_pure_premium', 'challenger_pure_premium',
              ]:
                  assert np.isclose(body[field], expected[field], rtol=1e-10, atol=1e-10)
              summary = {
                  'status': 'success',
                  'health': health,
                  'network_score_parity': True,
                  'container_image': 'motor-pricing-shadow:v21',
              }
              Path('deployment_artifacts/container_smoke_summary.json').write_text(
                  json.dumps(summary, indent=2), encoding='utf-8'
              )
              print(json.dumps(summary, indent=2))
          PY
          docker logs motor-pricing-shadow-v21
          docker rm -f motor-pricing-shadow-v21

      - name: Persist deployment evidence
        if: always() && github.event_name == 'push'
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contracts.outcome }}
          DISCOVER_OUTCOME: ${{ steps.discover.outcome }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          BUNDLE_OUTCOME: ${{ steps.bundle.outcome }}
          PARITY_OUTCOME: ${{ steps.parity.outcome }}
          DOCKER_BUILD_OUTCOME: ${{ steps.docker_build.outcome }}
          CONTAINER_SMOKE_OUTCOME: ${{ steps.container_smoke.outcome }}
        run: |
          mkdir -p action_results/v21
          python - <<'PY'
          import json, os
          from pathlib import Path
          status = {
              'workflow': 'Motor pricing shadow deployment v0.21',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'sha': os.environ.get('GITHUB_SHA'),
              'install_outcome': os.environ.get('INSTALL_OUTCOME'),
              'contract_outcome': os.environ.get('CONTRACT_OUTCOME'),
              'discover_outcome': os.environ.get('DISCOVER_OUTCOME'),
              'download_outcome': os.environ.get('DOWNLOAD_OUTCOME'),
              'audit_outcome': os.environ.get('AUDIT_OUTCOME'),
              'bundle_outcome': os.environ.get('BUNDLE_OUTCOME'),
              'parity_outcome': os.environ.get('PARITY_OUTCOME'),
              'docker_build_outcome': os.environ.get('DOCKER_BUILD_OUTCOME'),
              'container_smoke_outcome': os.environ.get('CONTAINER_SMOKE_OUTCOME'),
          }
          Path('action_results/v21/ACTION_V21_STATUS.json').write_text(
              json.dumps(status, indent=2), encoding='utf-8'
          )
          PY
          for f in manifest.json parity_reference.json deployment_smoke_summary.json container_smoke_summary.json openapi.json; do
            test -f "deployment_artifacts/$f" && cp "deployment_artifacts/$f" "action_results/v21/$f" || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- action_results/v21
          if git diff --cached --quiet; then
            echo 'No v0.21 deployment evidence changes'
          else
            git commit -m "Persist v0.21 shadow deployment run ${GITHUB_RUN_ID}"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload complete deployment bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-pricing-shadow-deployment-v21
          path: deployment_artifacts/
          if-no-files-found: warn
