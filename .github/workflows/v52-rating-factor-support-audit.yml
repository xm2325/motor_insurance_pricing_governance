name: Rating-factor support audit v0.52

on:
  pull_request:
    paths:
      - 'run_rating_factor_support_audit_v52.py'
      - 'tests/test_rating_factor_support_v52.py'
      - 'scripts/migrate_evidence_registry_v52.py'
      - 'RESULTS_V52.md'
      - '.github/workflows/v52-rating-factor-support-audit.yml'
      - 'deployment/contracts.py'
      - 'download_spanish_motor_2022_2024.py'
      - 'discover_spanish_motor_2022_2024.py'
      - 'action_results/v51/**'
  push:
    branches: [main]
    paths:
      - 'run_rating_factor_support_audit_v52.py'
      - 'tests/test_rating_factor_support_v52.py'
      - 'scripts/migrate_evidence_registry_v52.py'
      - 'RESULTS_V52.md'
      - '.github/workflows/v52-rating-factor-support-audit.yml'
      - 'deployment/contracts.py'
      - 'action_results/v51/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rating-factor-support:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified public-data cache
        uses: actions/cache@v4
        with:
          path: data_spanish_2022_2024
          key: spanish-motor-sw4jmdb2sm-v1-${{ runner.os }}
      - name: Install support-audit dependencies only
        run: pip install pandas==3.0.5 numpy==2.5.2 pydantic==2.13.4
      - name: Verify support audit does not import ML stack
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('run_rating_factor_support_audit_v52.py').read_text(encoding='utf-8')
          for forbidden in ['sklearn', 'xgboost', 'model_definitions', '.fit(']:
              assert forbidden not in source, forbidden
          PY
      - name: Discover Spanish source
        run: python discover_spanish_motor_2022_2024.py
      - name: Download or reuse and verify source
        run: python download_spanish_motor_2022_2024.py
      - name: Run label-free 2022-to-2024 support audit
        run: python run_rating_factor_support_audit_v52.py
      - name: Run v0.52 contracts
        run: python -m unittest -v tests/test_rating_factor_support_v52.py
      - name: Apply and verify evidence-registry migration
        run: |
          python scripts/migrate_evidence_registry_v52.py
          cp EVIDENCE_REGISTRY.md /tmp/EVIDENCE_REGISTRY.v52.once.md
          python scripts/migrate_evidence_registry_v52.py
          cmp EVIDENCE_REGISTRY.md /tmp/EVIDENCE_REGISTRY.v52.once.md
      - name: Assert no outcomes, model fit, subjective score or row-level persistence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('results_v52/rating_factor_support_summary_v52.json').read_text())
          assert s['analysis_role'] == 'POST_HOC_LABEL_FREE_FEATURE_SUPPORT_AND_MIX_AUDIT'
          assert s['source']['years_read'] == [2022, 2024]
          assert s['source']['2023_rows_read'] is False
          assert s['source']['claim_outcomes_read'] is False
          assert s['source']['incurred_loss_read'] is False
          assert s['source']['actual_premium_read'] is False
          assert s['source']['customer_id_read'] is False
          assert s['source']['policy_status_read'] is False
          assert s['definitions']['no_composite_score'] is True
          assert s['definitions']['no_alert_or_acceptance_threshold_created'] is True
          b = s['interpretation_boundary']
          assert b['validation_performance_evidence_created'] is False
          assert b['candidate_selection_allowed'] is False
          assert b['model_fit_executed'] is False
          assert b['model_promotion_evidence_created'] is False
          assert b['customer_pricing_authorised'] is False
          assert s['persisted_row_level_data'] is False
          PY
          test ! -e results_v52/predictions.csv
          test ! -e results_v52/raw_rows.csv
          if find results_v52 -type f \( -name '*.joblib' -o -name '*.ubj' -o -name '*.pkl' -o -name '*.parquet' \) | grep -q .; then
            echo 'v0.52 must persist aggregate support diagnostics only' >&2
            exit 1
          fi
      - name: Persist v0.52 support and mix evidence
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          mkdir -p action_results/v52
          cp results_v52/rating_factor_support_summary_v52.json action_results/v52/
          cp results_v52/numeric_feature_support_v52.csv action_results/v52/
          cp results_v52/categorical_feature_support_v52.csv action_results/v52/
          cp results_v52/categorical_level_shift_v52.csv action_results/v52/
          python - <<'PY'
          import json, os
          from pathlib import Path
          s = json.loads(Path('results_v52/rating_factor_support_summary_v52.json').read_text())
          numeric = s['numeric_features']
          categorical = s['categorical_features']
          Path('action_results/v52/ACTION_V52_STATUS.json').write_text(json.dumps({
              'workflow': 'Rating-factor support audit v0.52',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'sha': os.environ.get('GITHUB_SHA'),
              'status': 'success',
              'analysis_role': s['analysis_role'],
              'source_years_read': s['source']['years_read'],
              'development_rows': s['source']['development_rows'],
              'current_rows': s['source']['current_rows'],
              'claim_outcomes_read': False,
              'model_fit_executed': False,
              'validation_performance_evidence_created': False,
              'candidate_selection_allowed': False,
              'model_promotion_evidence_created': False,
              'customer_pricing_authorised': False,
              'persisted_row_level_data': False,
              'max_numeric_strict_extrapolation_feature': s['rankings']['numeric_strict_extrapolation'][0],
              'max_numeric_strict_extrapolation_exposure_share': numeric[s['rankings']['numeric_strict_extrapolation'][0]]['current_outside_development_observed_range_exposure_share'],
              'top_categorical_mix_shift_feature': s['rankings']['categorical_mix_shift'][0],
              'top_categorical_mix_tv': categorical[s['rankings']['categorical_mix_shift'][0]]['total_variation_distance_2022_vs_2024'],
              'business_type_unseen_exposure_share': categorical['business_type']['current_unseen_nonmissing_exposure_share'],
              'model_family_decision': 'HOLD',
              'serving_status': 'HOLD_SHADOW_ONLY',
              'committee_readiness': 'EVIDENCE_GAP_HOLD',
              'evidence_role': 'ROLLING_LABEL_FREE_FEATURE_SUPPORT_AUDIT',
          }, indent=2), encoding='utf-8')
          PY
          origin_dir="action_results/v52/origin/${GITHUB_RUN_ID}"
          if [ -e "$origin_dir" ]; then
            echo "Refusing to overwrite immutable v0.52 origin snapshot: $origin_dir" >&2
            exit 1
          fi
          mkdir -p "$origin_dir"
          cp action_results/v52/rating_factor_support_summary_v52.json "$origin_dir/"
          cp action_results/v52/numeric_feature_support_v52.csv "$origin_dir/"
          cp action_results/v52/categorical_feature_support_v52.csv "$origin_dir/"
          cp action_results/v52/categorical_level_shift_v52.csv "$origin_dir/"
          cp action_results/v52/ACTION_V52_STATUS.json "$origin_dir/"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('action_results/v52/origin') / os.environ['GITHUB_RUN_ID'] / 'ACTION_V52_STATUS.json'
          s = json.loads(p.read_text(encoding='utf-8'))
          s['evidence_role'] = 'IMMUTABLE_LABEL_FREE_FEATURE_SUPPORT_AUDIT_SNAPSHOT'
          p.write_text(json.dumps(s, indent=2), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- EVIDENCE_REGISTRY.md action_results/v52
          if git diff --cached --quiet; then
            echo 'No v0.52 evidence changes'
          else
            git commit -m "Persist v0.52 rating-factor support audit ${GITHUB_RUN_ID}"
            bash scripts/push_evidence_with_rebase.sh "$GITHUB_REF_NAME"
          fi
      - name: Upload v0.52 aggregate support audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-pricing-rating-factor-support-v52
          path: results_v52/
          if-no-files-found: error
