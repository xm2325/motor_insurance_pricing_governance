name: Historical recruiter front-door audit v0.50

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-front-door-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce historical v0.50 front door in ephemeral worktree
        run: |
          python scripts/refresh_repository_front_door_v50.py
          python scripts/refresh_interview_evidence_pack_v50.py
          python build_repository_front_door_summary_v50.py
          python -m unittest -v tests/test_repository_front_door_v50.py
      - name: Assert historical audit cannot write repository state
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/v50-recruiter-front-door.yml').read_text(encoding='utf-8')
          assert '  push:' not in workflow
          assert '  pull_request:' not in workflow
          assert 'contents: read' in workflow
          assert 'git push' not in workflow
          assert 'push_evidence_with_rebase' not in workflow
          PY
