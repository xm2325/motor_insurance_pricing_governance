name: Rating-factor relativity audit v0.51

on:
  pull_request:
    paths:
      - 'run_rating_factor_relativity_audit_v51.py'
      - 'tests/test_rating_factor_relativity_v51.py'
      - 'scripts/migrate_evidence_registry_v51.py'
      - 'governance/v51_repeat_run_audit.json'
      - 'RESULTS_V51.md'
      - '.github/workflows/v51-rating-factor-relativity-audit.yml'
      - 'build_deployment_bundle_v21.py'
      - 'deployment/**'
      - 'download_spanish_motor_2022_2024.py'
      - 'discover_spanish_motor_2022_2024.py'
      - 'requirements.txt'
  push:
    branches: [main]
    paths:
      - 'run_rating_factor_relativity_audit_v51.py'
      - 'tests/test_rating_factor_relativity_v51.py'
      - 'scripts/migrate_evidence_registry_v51.py'
      - 'governance/v51_repeat_run_audit.json'
      - 'RESULTS_V51.md'
      - '.github/workflows/v51-rating-factor-relativity-audit.yml'
      - 'build_deployment_bundle_v21.py'
      - 'deployment/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rating-factor-relativity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Restore verified public-data cache
        uses: actions/cache@v4
        with:
          path: data_spanish_2022_2024
          key: spanish-motor-sw4jmdb2sm-v1-${{ runner.os }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Discover Spanish source
        run: python discover_spanish_motor_2022_2024.py
      - name: Download or reuse and verify source
        run: python download_spanish_motor_2022_2024.py
      - name: Run 2022 development-only rating-factor audit
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python run_rating_factor_relativity_audit_v51.py
      - name: Run v0.51 contracts
        run: python -m unittest -v tests/test_rating_factor_relativity_v51.py
      - name: Apply and verify evidence-registry migration
        run: |
          python scripts/migrate_evidence_registry_v51.py
          cp EVIDENCE_REGISTRY.md /tmp/EVIDENCE_REGISTRY.v51.once.md
          python scripts/migrate_evidence_registry_v51.py
          cmp EVIDENCE_REGISTRY.md /tmp/EVIDENCE_REGISTRY.v51.once.md
      - name: Assert development-only and aggregate-output boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('results_v51/rating_factor_relativity_summary_v51.json').read_text())
          assert s['analysis_role'] == 'DEVELOPMENT_ONLY_REFERENCE_PROFILE_INTERPRETABILITY_AUDIT'
          assert s['source']['years_read'] == [2022]
          assert s['source']['2023_rows_read'] is False
          assert s['source']['2024_rows_read'] is False
          assert s['source']['incurred_loss_read'] is False
          assert s['source']['actual_premium_read'] is False
          assert s['source']['customer_id_read'] is False
          assert s['frozen_frequency_definition']['model_fit_executed'] is True
          assert s['frozen_frequency_definition']['calibration_applied'] is False
          b = s['interpretation_boundary']
          assert b['reference_profile_not_population_average_pdp'] is True
          assert b['validation_performance_evidence_created'] is False
          assert b['candidate_selection_allowed'] is False
          assert b['model_promotion_evidence_created'] is False
          assert b['customer_pricing_authorised'] is False
          assert b['actual_premium_or_quote'] is False
          assert s['persisted_row_level_data'] is False
          repeat = json.loads(Path('governance/v51_repeat_run_audit.json').read_text())
          assert repeat['status'] == 'V51_DEVELOPMENT_INTERPRETABILITY_REPEAT_RUN_AUDIT_PASS'
          assert repeat['interpretation']['validation_reproducibility_claimed'] is False
          assert repeat['interpretation']['performance_reproducibility_claimed'] is False
          assert repeat['customer_pricing_authorised'] is False
          PY
          test ! -e results_v51/predictions.csv
          test ! -e results_v51/raw_rows.csv
          if find results_v51 -type f \( -name '*.joblib' -o -name '*.ubj' -o -name '*.pkl' -o -name '*.parquet' \) | grep -q .; then
            echo 'v0.51 must persist reference-profile aggregate diagnostics only' >&2
            exit 1
          fi
      - name: Persist v0.51 development interpretability evidence
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          mkdir -p action_results/v51
          cp results_v51/rating_factor_relativity_summary_v51.json action_results/v51/
          cp results_v51/numeric_rating_factor_relativities_v51.csv action_results/v51/
          cp results_v51/categorical_rating_factor_relativities_v51.csv action_results/v51/
          cp governance/v51_repeat_run_audit.json action_results/v51/
          python - <<'PY'
          import json, os
          from pathlib import Path
          s = json.loads(Path('results_v51/rating_factor_relativity_summary_v51.json').read_text())
          repeat = json.loads(Path('governance/v51_repeat_run_audit.json').read_text())
          Path('action_results/v51/ACTION_V51_STATUS.json').write_text(json.dumps({
              'workflow': 'Rating-factor relativity audit v0.51',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'sha': os.environ.get('GITHUB_SHA'),
              'status': 'success',
              'analysis_role': s['analysis_role'],
              'source_years_read': s['source']['years_read'],
              'development_rows': s['source']['rows'],
              'model_fit_executed': True,
              '2023_rows_read': False,
              '2024_rows_read': False,
              'validation_performance_evidence_created': False,
              'candidate_selection_allowed': False,
              'model_promotion_evidence_created': False,
              'customer_pricing_authorised': False,
              'persisted_row_level_data': False,
              'top_numeric_shape_gap_feature': s['ranked_numeric_shape_gaps'][0]['feature'],
              'top_numeric_shape_gap': s['ranked_numeric_shape_gaps'][0]['max_absolute_log_relativity_gap'],
              'repeat_run_conclusion': repeat['interpretation']['conclusion'],
              'model_family_decision': 'HOLD',
              'serving_status': 'HOLD_SHADOW_ONLY',
              'committee_readiness': 'EVIDENCE_GAP_HOLD',
              'evidence_role': 'ROLLING_DEVELOPMENT_INTERPRETABILITY_AUDIT',
          }, indent=2), encoding='utf-8')
          PY
          origin_dir="action_results/v51/origin/${GITHUB_RUN_ID}"
          if [ -e "$origin_dir" ]; then
            echo "Refusing to overwrite immutable v0.51 origin snapshot: $origin_dir" >&2
            exit 1
          fi
          mkdir -p "$origin_dir"
          cp action_results/v51/rating_factor_relativity_summary_v51.json "$origin_dir/"
          cp action_results/v51/numeric_rating_factor_relativities_v51.csv "$origin_dir/"
          cp action_results/v51/categorical_rating_factor_relativities_v51.csv "$origin_dir/"
          cp action_results/v51/v51_repeat_run_audit.json "$origin_dir/"
          cp action_results/v51/ACTION_V51_STATUS.json "$origin_dir/"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('action_results/v51/origin') / os.environ['GITHUB_RUN_ID'] / 'ACTION_V51_STATUS.json'
          s = json.loads(p.read_text(encoding='utf-8'))
          s['evidence_role'] = 'IMMUTABLE_DEVELOPMENT_INTERPRETABILITY_AUDIT_SNAPSHOT'
          p.write_text(json.dumps(s, indent=2), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- EVIDENCE_REGISTRY.md action_results/v51
          if git diff --cached --quiet; then
            echo 'No v0.51 evidence changes'
          else
            git commit -m "Persist v0.51 rating-factor relativity audit ${GITHUB_RUN_ID}"
            bash scripts/push_evidence_with_rebase.sh "$GITHUB_REF_NAME"
          fi
      - name: Upload v0.51 aggregate interpretability audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-pricing-rating-factor-relativity-v51
          path: results_v51/
          if-no-files-found: error
