name: Rating front-door sync v0.54

on:
  pull_request:
    paths:
      - 'scripts/refresh_repository_front_door_v54.py'
      - 'scripts/refresh_interview_evidence_pack_v54.py'
      - 'build_rating_front_door_summary_v54.py'
      - 'tests/test_rating_front_door_v54.py'
      - 'scripts/migrate_evidence_registry_v54.py'
      - 'RESULTS_V54.md'
      - '.github/workflows/v54-rating-front-door.yml'
      - '.github/workflows/v50-recruiter-front-door.yml'
      - 'RATING_FACTOR_REVIEW_PACK.md'
      - 'action_results/v53/**'
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_repository_front_door_v54.py'
      - 'scripts/refresh_interview_evidence_pack_v54.py'
      - 'build_rating_front_door_summary_v54.py'
      - 'tests/test_rating_front_door_v54.py'
      - 'scripts/migrate_evidence_registry_v54.py'
      - 'RESULTS_V54.md'
      - '.github/workflows/v54-rating-front-door.yml'
      - '.github/workflows/v50-recruiter-front-door.yml'
      - 'RATING_FACTOR_REVIEW_PACK.md'
      - 'action_results/v53/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rating-front-door:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preserve pre-refresh historical README body
        run: cp README.md /tmp/README.before-v54.md

      - name: Refresh README and interview pack idempotently
        run: |
          python scripts/refresh_repository_front_door_v54.py
          cp README.md /tmp/README.v54.once.md
          python scripts/refresh_repository_front_door_v54.py
          cmp README.md /tmp/README.v54.once.md
          python scripts/refresh_interview_evidence_pack_v54.py
          cp INTERVIEW_EVIDENCE_PACK.md /tmp/INTERVIEW.v54.once.md
          python scripts/refresh_interview_evidence_pack_v54.py
          cmp INTERVIEW_EVIDENCE_PACK.md /tmp/INTERVIEW.v54.once.md

      - name: Build v0.54 documentation audit
        run: python build_rating_front_door_summary_v54.py

      - name: Run v0.54 rating front-door contracts
        run: python -m unittest -v tests/test_rating_front_door_v54.py

      - name: Apply and verify evidence-registry migration
        run: |
          python scripts/migrate_evidence_registry_v54.py
          cp EVIDENCE_REGISTRY.md /tmp/EVIDENCE_REGISTRY.v54.once.md
          python scripts/migrate_evidence_registry_v54.py
          cmp EVIDENCE_REGISTRY.md /tmp/EVIDENCE_REGISTRY.v54.once.md

      - name: Verify historical README body is byte-identical
        run: |
          python - <<'PY'
          from pathlib import Path
          before = Path('/tmp/README.before-v54.md').read_text(encoding='utf-8')
          after = Path('README.md').read_text(encoding='utf-8')
          marker = '\n---\n'
          assert before.count(marker) == 1
          assert after.count(marker) == 1
          assert before.split(marker, 1)[1] == after.split(marker, 1)[1]
          PY

      - name: Verify documentation-only and stale-writer boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('results_v54/rating_front_door_summary_v54.json').read_text())
          assert s['status'] == 'V54_RATING_FRONT_DOOR_SYNC_PASS'
          assert s['scope'] == 'documentation_and_evidence_navigation_only'
          assert s['front_door_current_through'] == 'v0.53'
          assert s['row_level_data_accessed'] is False
          assert s['model_fit_executed'] is False
          assert s['historical_model_or_validation_decisions_changed'] is False
          assert s['v50_rolling_writer_frozen'] is True
          assert s['v45_rolling_writer_frozen'] is True
          assert all(s['checks'].values())
          b = s['headline_boundaries']
          assert b['benchmark_is_not_pricing_uplift'] is True
          assert b['consumed_validation_not_relabelled_fresh'] is True
          assert b['v51_not_relabelled_validation'] is True
          assert b['v52_not_relabelled_performance'] is True
          assert b['v53_not_relabelled_performance'] is True
          assert b['technical_relativity_not_customer_premium'] is True
          assert b['first_central_or_current_uk_transfer_claimed'] is False
          assert b['commercial_uplift_claimed'] is False
          h = s['rating_review_headlines']
          assert abs(h['driver_age_shape_gap'] - 0.26865990121735667) < 1e-12
          assert abs(h['driver_age_strict_extrapolation_exposure_share'] - 1.5871206507159884e-05) < 1e-15
          assert abs(h['business_type_mix_tv'] - 0.48595824222641637) < 1e-12
          assert h['business_type_unseen_exposure_share'] == 0.0
          d = s['current_decision']
          assert d['committee_status'] == 'EVIDENCE_GAP_HOLD'
          assert (d['committee_gate_pass_count'], d['committee_gate_count']) == (5, 8)
          assert d['external_target_gates'] == '0/4'
          assert d['model_family_decision'] == 'HOLD'
          assert d['serving_status'] == 'HOLD_SHADOW_ONLY'
          assert d['promotion_review_status'] == 'NOT_OPEN'
          assert d['customer_pricing_authorised'] is False
          v50 = Path('.github/workflows/v50-recruiter-front-door.yml').read_text(encoding='utf-8')
          assert '  push:' not in v50
          assert '  pull_request:' not in v50
          assert 'contents: read' in v50
          assert 'git push' not in v50
          assert 'push_evidence_with_rebase' not in v50
          PY

      - name: Persist v0.54 rolling front door and immutable audit
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          mkdir -p action_results/v54
          cp results_v54/rating_front_door_summary_v54.json action_results/v54/
          python - <<'PY'
          import json, os
          from pathlib import Path
          s = json.loads(Path('results_v54/rating_front_door_summary_v54.json').read_text())
          d = s['current_decision']
          h = s['rating_review_headlines']
          status = {
              'workflow': 'Rating front-door sync v0.54',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'sha': os.environ.get('GITHUB_SHA'),
              'status': 'success',
              'scope': s['scope'],
              'front_door_current_through': s['front_door_current_through'],
              'row_level_data_accessed': False,
              'model_fit_executed': False,
              'historical_model_or_validation_decisions_changed': False,
              'v50_rolling_writer_frozen': True,
              'v45_rolling_writer_frozen': True,
              'readme_historical_body_sha256': s['readme_historical_body_sha256'],
              'driver_age_shape_gap': h['driver_age_shape_gap'],
              'driver_age_strict_extrapolation_exposure_share': h['driver_age_strict_extrapolation_exposure_share'],
              'business_type_mix_tv': h['business_type_mix_tv'],
              'business_type_unseen_exposure_share': h['business_type_unseen_exposure_share'],
              'frequency_mean_absolute_portfolio_neutral_relativity_change': h['frequency_mean_absolute_portfolio_neutral_relativity_change'],
              'pure_premium_mean_absolute_portfolio_neutral_relativity_change': h['pure_premium_mean_absolute_portfolio_neutral_relativity_change'],
              'committee_status': d['committee_status'],
              'committee_gate_pass_count': d['committee_gate_pass_count'],
              'committee_gate_count': d['committee_gate_count'],
              'external_target_gates': d['external_target_gates'],
              'model_family_decision': d['model_family_decision'],
              'serving_status': d['serving_status'],
              'promotion_review_status': d['promotion_review_status'],
              'customer_pricing_authorised': d['customer_pricing_authorised'],
              'evidence_role': 'ROLLING_RATING_RECRUITER_FRONT_DOOR_SYNC',
          }
          Path('action_results/v54/ACTION_V54_STATUS.json').write_text(
              json.dumps(status, indent=2), encoding='utf-8'
          )
          PY
          origin_dir="action_results/v54/origin/${GITHUB_RUN_ID}"
          if [ -e "$origin_dir" ]; then
            echo "Refusing to overwrite immutable v0.54 origin snapshot: $origin_dir" >&2
            exit 1
          fi
          mkdir -p "$origin_dir"
          cp action_results/v54/rating_front_door_summary_v54.json "$origin_dir/"
          cp action_results/v54/ACTION_V54_STATUS.json "$origin_dir/"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('action_results/v54/origin') / os.environ['GITHUB_RUN_ID'] / 'ACTION_V54_STATUS.json'
          s = json.loads(p.read_text(encoding='utf-8'))
          s['evidence_role'] = 'IMMUTABLE_RATING_RECRUITER_FRONT_DOOR_SYNC_SNAPSHOT'
          p.write_text(json.dumps(s, indent=2), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md INTERVIEW_EVIDENCE_PACK.md EVIDENCE_REGISTRY.md action_results/v54
          if git diff --cached --quiet; then
            echo 'No v0.54 front-door changes'
          else
            git commit -m "Persist v0.54 rating front-door sync ${GITHUB_RUN_ID}"
            bash scripts/push_evidence_with_rebase.sh "$GITHUB_REF_NAME"
          fi

      - name: Upload v0.54 documentation audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-pricing-rating-front-door-v54
          path: results_v54/
          if-no-files-found: error
