name: Belgian external validation preregistration v0.40

on:
  pull_request:
    paths:
      - 'governance/external_validation_prereg_v40.json'
      - 'validate_external_validation_prereg_v40.py'
      - 'tests/test_external_validation_prereg_v40.py'
      - 'RESULTS_V40.md'
      - '.github/workflows/v40-belgian-external-prereg.yml'
  push:
    branches: [main]
    paths:
      - 'governance/external_validation_prereg_v40.json'
      - 'validate_external_validation_prereg_v40.py'
      - 'tests/test_external_validation_prereg_v40.py'
      - 'RESULTS_V40.md'
      - '.github/workflows/v40-belgian-external-prereg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  belgian-external-preregistration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Belgian preregistration contracts before row-level access
        run: python -m unittest -v tests/test_external_validation_prereg_v40.py
      - name: Seal Belgian preregistration protocol
        run: python validate_external_validation_prereg_v40.py
      - name: Verify second-external evidence boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('results_v40/belgian_external_validation_prereg_lock.json').read_text())
          assert result['status'] == 'V40_BELGIAN_EXTERNAL_VALIDATION_PREREGISTRATION_LOCKED'
          assert result['registered_before_row_level_access'] is True
          assert result['row_level_external_data_present'] is False
          assert result['source_dataset'] == 'beMTPL97'
          assert result['source_commit'] == '227fb56b8734bdb7c0327a41180e01d2ddaeaf26'
          assert result['known_public_rows'] == 163212
          assert result['split']['fractions'] == [0.6, 0.2, 0.2]
          assert result['bootstrap_draws'] == 500
          assert result['minimum_reproducibility_runs_for_positive_support'] == 2
          assert result['glm_solver'] == 'newton-cholesky'
          assert result['glm_tolerance'] == 1e-10
          assert result['model_family_decision'] == 'HOLD'
          assert result['serving_status'] == 'HOLD_SHADOW_ONLY'
          assert result['execution_allowed_only_after_preregistration_is_on_main'] is True
          PY
      - name: Persist v0.40 preregistration lock
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          mkdir -p action_results/v40
          cp results_v40/belgian_external_validation_prereg_lock.json action_results/v40/
          cp governance/external_validation_prereg_v40.json action_results/v40/
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('action_results/v40/ACTION_V40_STATUS.json').write_text(json.dumps({
              'workflow': 'Belgian external validation preregistration v0.40',
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'sha': os.environ.get('GITHUB_SHA'),
              'status': 'success',
              'row_level_external_data_accessed': False,
              'positive_support_minimum_independent_executions': 2,
          }, indent=2), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- action_results/v40
          if git diff --cached --quiet; then
            echo 'No v0.40 preregistration evidence changes'
          else
            git commit -m "Persist v0.40 Belgian external preregistration ${GITHUB_RUN_ID}"
            bash scripts/push_evidence_with_rebase.sh "$GITHUB_REF_NAME"
          fi
      - name: Upload preregistration lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-pricing-belgian-external-validation-prereg-v40
          path: results_v40/
          if-no-files-found: warn
