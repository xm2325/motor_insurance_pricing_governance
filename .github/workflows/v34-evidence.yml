name: Persisted v0.34 uncertainty evidence contract

on:
  push:
    branches: [main]
    paths:
      - 'action_results/v34/**'
      - 'tests/test_frequency_recalibration_uncertainty_evidence_v34.py'
      - 'RESULTS_V34.md'
      - 'EVIDENCE_REGISTRY.md'
      - 'README.md'
      - '.github/workflows/v34-evidence.yml'
  pull_request:
    paths:
      - 'action_results/v34/**'
      - 'tests/test_frequency_recalibration_uncertainty_evidence_v34.py'
      - 'RESULTS_V34.md'
      - 'EVIDENCE_REGISTRY.md'
      - 'README.md'
      - '.github/workflows/v34-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persisted-v34-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify persisted v0.34 uncertainty evidence
        run: python -m unittest -v tests/test_frequency_recalibration_uncertainty_evidence_v34.py
